name: TESSEL alpha.3 test APK
on:
  push:
    branches:
      - build/alpha3
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android SDK platform
        shell: bash
        run: |
          echo "SDK: $ANDROID_HOME"
          sdkmanager "platforms;android-37"
      - name: Build signed debug test APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Run Android unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
        continue-on-error: true
      - name: Verify debug APK and record digest
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p test-output
          cp "$APK" test-output/TESSEL-V1.1.0-alpha.3-test.apk
          (cd test-output && sha256sum TESSEL-V1.1.0-alpha.3-test.apk > SHA256SUMS.txt)
      - name: Upload test APK (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: TESSEL-V1.1.0-alpha.3-test
          path: test-output/
          if-no-files-found: error
          retention-days: 7
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TESSEL-alpha3-unit-tests
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
