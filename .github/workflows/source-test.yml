name: TESSEL alpha.7 source checks
on:
  push:
    branches: [test/alpha7]
permissions:
  contents: read
jobs:
  source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - name: Compile and run Android unit tests (no APK assembly)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TESSEL-alpha7-unit-tests
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
