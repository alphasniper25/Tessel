name: TESSEL alpha.18 source checks
on:
  push:
    branches: [test/alpha18]
concurrency:
  group: alpha18-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - name: Compile and run Android unit tests
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            if ./gradlew --no-daemon testDebugUnitTest > gradle-test.log 2>&1; then cat gradle-test.log; exit 0; fi
            cat gradle-test.log
            if ! grep -q 'status code 429' gradle-test.log || [ "$i" = 3 ]; then exit 1; fi
            sleep 15
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TESSEL-alpha18-unit-tests
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
      # Source-only visual correction; no APK assembly or signing.
