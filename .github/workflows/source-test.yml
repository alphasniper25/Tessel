name: TESSEL alpha.15 source checks
on:
  push:
    branches: [test/alpha15]
concurrency:
  group: alpha15-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - name: Compile and run Android unit tests
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            if ./gradlew --no-daemon testDebugUnitTest > gradle-test.log 2>&1; then cat gradle-test.log; exit 0; fi
            cat gradle-test.log
            if ! grep -q 'status code 429' gradle-test.log || [ "$i" = 3 ]; then exit 1; fi
            sleep 15
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TESSEL-alpha15-unit-tests
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
      # Source-only candidate: no APK assembly, signing or publication.

  balance-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            ref: 5818be50af9bd2fcce8cdd7a9de98c2c1591f291
          - variant: candidate
            ref: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: game
      - run: cp harness/app/src/test/kotlin/dev/david/tessel/core/sim/BalanceAuditTest.kt game/app/src/test/kotlin/dev/david/tessel/core/sim/BalanceAuditTest.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - name: Run matched frame and campaign audit (no APK)
        working-directory: game
        env:
          TESSEL_BALANCE_AUDIT: '1'
          TESSEL_BALANCE_OUT: ${{ github.workspace }}/balance-results
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest --tests '*BalanceAuditTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TESSEL-alpha15-balance-${{ matrix.variant }}
          path: |
            balance-results/
            game/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 30
