name: TESSEL alpha.17 rework source checks
on:
  push:
    branches: [test/alpha17-rework]
concurrency:
  group: alpha17-rework-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - name: Compile and run Android unit tests
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            if ./gradlew --no-daemon testDebugUnitTest > gradle-test.log 2>&1; then cat gradle-test.log; exit 0; fi
            cat gradle-test.log
            if ! grep -q 'status code 429' gradle-test.log || [ "$i" = 3 ]; then exit 1; fi
            sleep 15
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TESSEL-alpha17-rework-unit-tests
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
      - name: Assemble authorized alpha.17 test APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TESSEL-alpha17-rework-debug-intermediate
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Stage SDK verification tools
        run: |
          mkdir -p build/signing-tools
          cp "$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar" build/signing-tools/
          cp "$ANDROID_HOME/build-tools/37.0.0/zipalign" build/signing-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: TESSEL-alpha17-sdk-signing-tools
          path: build/signing-tools/
          if-no-files-found: error
          retention-days: 7
      # Original private signing key remains outside GitHub; sign locally.



  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - name: Capture actual production Compose menus with native Android graphics
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Pshots testDebugUnitTest --tests '*ScreenshotsMenuGallery*' --tests '*Screenshots.aStageInFullSwing' --tests '*Screenshots.aBoss' --tests '*Screenshots.pauseAndRunOver'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TESSEL-alpha17-rework-native-menu-screenshots
          path: |
            docs/menu-gallery/*.png
            docs/stage.png
            docs/boss.png
            app/build/screens/*.png
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 30
